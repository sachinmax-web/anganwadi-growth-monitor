<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login — Anganwadi Growth Monitor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #1a3c5e,
                #2563eb
            );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {

            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.2);

        }

        .logo {

            width: 75px;
            height: 75px;

            border-radius: 50%;

            background: #e8f1ff;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 20px;

            color: #2563eb;

            font-size: 35px;

        }

        .login-title {

            font-weight: 700;

            color: #1a3c5e;

        }

        .form-control {

            padding: 12px 15px;

            border-radius: 10px;

        }

        .form-control:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 0.2rem
                rgba(37, 99, 235, 0.15);

        }

        .login-btn {

            width: 100%;

            padding: 12px;

            border-radius: 10px;

            font-weight: 600;

            background: #2563eb;

            border: none;

        }

        .login-btn:hover {

            background: #1d4ed8;

        }

        .brand-text {

            color: #6b7280;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- Logo -->

    <div class="logo">

        <i class="bi bi-heart-pulse-fill"></i>

    </div>


    <!-- Title -->

    <div class="text-center mb-4">

        <h3 class="login-title">

            Anganwadi Growth Monitor

        </h3>

        <p class="brand-text mb-0">

            Login to access the monitoring dashboard

        </p>

    </div>


    <!-- Flash Messages -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

        <div class="alert alert-{{ category }} alert-dismissible fade show">

            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>

        </div>

        {% endfor %}

    {% endwith %}


    <!-- Login Form -->

    <form method="POST">


        <!-- Username -->

        <div class="mb-3">

            <label class="form-label fw-semibold">

                Username

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person-fill"></i>

                </span>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>

        </div>


        <!-- Password -->

        <div class="mb-4">

            <label class="form-label fw-semibold">

                Password

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock-fill"></i>

                </span>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>

        </div>


        <!-- Login Button -->

        <button
            type="submit"
            class="btn btn-primary login-btn">

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Login

        </button>


    </form>


    <div class="text-center mt-4">

        <small class="text-muted">

            Anganwadi Growth Monitoring System

        </small>

    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
